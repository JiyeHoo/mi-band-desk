<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>机器人桌搭 · 0.4 设计预览</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#10191e;color:#e5f0f0;font:15px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{max-width:1100px;margin:auto;padding:38px 28px}header{display:flex;align-items:center;gap:18px;margin-bottom:28px}header img{width:80px}h1{margin:0 0 8px;font-size:30px}p{margin:0;color:#98b2bb;line-height:1.7}button{font:inherit;cursor:pointer;border:1px solid #38525b;background:#1b2b33;color:#e5f0f0;border-radius:12px;padding:10px 17px;min-height:42px}button:hover{border-color:#80e7cd}button[aria-pressed=true]{background:#80e7cd;color:#142e29;border-color:#80e7cd}button:focus-visible{outline:3px solid #ffd572;outline-offset:3px}.preview{padding:28px;background:#16242b;border:1px solid #2c414b;border-radius:24px}.meta{display:flex;justify-content:space-between;color:#a8c0c5;font-size:13px}.viewport{height:330px;display:flex;justify-content:center;align-items:center;overflow:hidden}.sizer{position:relative;width:490px;height:192px;flex:none;transform-origin:center}.pill{width:490px;height:192px;position:relative;background:#000;border-radius:96px;overflow:hidden;box-shadow:0 0 0 6px #06090b,0 0 0 8px #3e525c;touch-action:none;user-select:none}.screen,.deck{width:490px;height:192px;position:absolute;left:0;top:0;transform-origin:245px 96px}.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.help{font-size:12px;text-align:center;margin-top:16px}.options{display:flex;justify-content:center;gap:22px;margin-top:20px;color:#a8c0c5;font-size:13px}input{accent-color:#80e7cd}h2{margin:28px 0 12px;font-size:20px}.moods{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.mood{padding:12px 6px;font-size:13px}.mood img{height:35px;width:35px;object-fit:contain;display:block;margin:auto auto 8px}.note{margin:25px 0;font-size:13px}.sprite{position:absolute;object-fit:fill}.eye-well{position:absolute;top:32px;width:128px;height:128px;background:#000}.left-eye{left:101px}.right-eye{left:261px}.eye-image{position:absolute;left:0;top:0;width:128px;height:128px}.lid{position:absolute;background:#000}.placed{position:absolute;text-align:center}.heading{left:40px;top:16px;width:410px;height:38px;line-height:38px;color:#9fcbcf;font-size:28px}.time{left:24px;top:57px;width:442px;height:114px;color:#80e7cd;font-size:96px;line-height:114px;font-variant-numeric:tabular-nums}.title{left:45px;top:10px;width:400px;height:38px;line-height:38px;font-size:30px;color:#d9f3ff}.confirm-text{left:100px;top:67px;width:290px;height:58px;line-height:58px;font-size:36px;color:white}.setting{top:61px;width:144px;height:108px;border:0;border-radius:26px;font-size:30px;line-height:44px;padding:0}.setting small{display:block;font-size:26px;line-height:36px;color:#c8dedb}.keep{left:18px;background:#183b34}.flip{left:173px;background:#203449}.exit{left:328px;background:#422b30;color:#e7ad97}.week{top:65px;width:62px;height:100px}.weekday{font-size:26px;color:#9fcbcf;height:38px;line-height:38px}.weekend{color:#f5a18d}.number{font-size:34px;height:53px;line-height:53px;width:52px;margin:3px auto 0;border-radius:12px}.today{background:#ffd572;color:#30251c}.confirm-btn{top:0;width:92px;height:192px;padding:0;border:0;background:none;border-radius:0}.confirm-btn img{width:92px;height:192px}.paused *{animation-play-state:paused!important}a{color:#80e7cd}.status{color:#ffd572}
@media(max-width:740px){main{padding:24px 16px}.preview{padding:22px 12px}.moods{grid-template-columns:repeat(4,1fr)}h1{font-size:25px}header img{width:62px}.viewport{height:215px}.meta{font-size:11px}}
</style></head><body><main><header><img src="assets/launcher.png" alt="机器人桌搭图标"><div><h1>机器人桌搭</h1><p>白色眼睛，清晰的表情节奏；彩色桌面，充分利用胶囊屏。</p></div></header><section class="preview"><div class="meta"><span>小米手环 9 · 横屏 490 × 192</span><span id="label" class="status">双连眨眼</span></div><div class="viewport"><div class="sizer"><div class="pill" tabindex="0" aria-label="可滑动预览，左右切桌面，上下开关设置"><div class="screen"><div class="deck"></div></div></div></div></div><div class="nav"><button data-view="eyes">眼睛</button><button data-view="clock">时钟</button><button data-view="calendar">七天日历</button><button data-view="menu">上滑设置</button><button data-view="confirm">退出确认</button></div><p class="help">在屏幕上滑动，或按方向键；点击眼睛换一个表情。</p><div class="options"><label><input type="checkbox" id="random" checked>随机表情</label><label><input type="checkbox" id="pause">暂停动画</label></div></section><h2>十四种表情 · 点击单独预览</h2><div class="moods"></div><p class="note">取消中央安全区限制，按照实际胶囊轮廓排布文字和两端按钮。眼睛位置固定，眨眼、比心和流泪通过重复节奏表达。预览复用设备的图形资源、动作数据和插值函数，但浏览器流畅度不代表手环表现。左右、上下切屏使用 420ms 滑动与淡入淡出。<br>设置按钮仅作演示。<a href="../README.md">调研与验证说明</a></p></main><script src="scenes.js"></script><script src="animation.js"></script><script>
const q=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];let view='eyes',home='eyes',emotion='blink',flipped=false,keep=0,timer=null;const deck=q('.deck');let moodElapsed=0,lastTick=performance.now(),cardEpoch=0;
const sprite=path=>'assets/'+path.split('/').pop();
function eyes(){const s=ROBOT_SCENES[emotion];return ['left','right'].map(side=>`<div class="eye-well ${side}-eye"><img class="eye-image" src="${sprite(s[side])}"><div class="lid" data-part="${side}Top"></div><div class="lid" data-part="${side}Bottom"></div></div>`).join('')+s.effects.map((path,i)=>`<img class="sprite" data-part="effect${i}Motion" src="${sprite(path)}">`).join('')}
function drawMotion(){if(view!=='eyes')return;const styles=sceneFrame(ROBOT_SCENES[emotion],moodElapsed);all('[data-part]').forEach(el=>{el.style.cssText=styles[el.dataset.part]});}
setInterval(()=>{const now=performance.now();if(!q('#pause').checked)moodElapsed+=now-lastTick;lastTick=now;drawMotion()},FRAME_MS);

function render(){const now=new Date(),weeks=['日','一','二','三','四','五','六'];if(view==='eyes')deck.innerHTML=eyes();else if(view==='clock')deck.innerHTML=`<div class="placed heading">${now.getMonth()+1}月${now.getDate()}日 · 周${weeks[now.getDay()]}</div><div class="placed time">${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</div>`;else if(view==='calendar'){const first=new Date(now);first.setDate(now.getDate()-(now.getDay()+6)%7);const last=new Date(first);last.setDate(first.getDate()+6);deck.innerHTML=`<div class="placed heading">${first.getMonth()+1}月${first.getDate()}日 — ${last.getMonth()+1}月${last.getDate()}日</div>`+Array.from({length:7},(_,i)=>{const d=new Date(first);d.setDate(first.getDate()+i);return `<div class="placed week" style="left:${22+i*64}px"><div class="weekday ${i>4?'weekend':''}">${weeks[d.getDay()]}</div><div class="number ${d.getDate()===now.getDate()?'today':''}">${d.getDate()}</div></div>`}).join('')}else if(view==='menu')deck.innerHTML=`<div class="placed title">桌搭设置</div><button class="placed setting keep" data-action="keep">常亮<small>${['关','30 分','2 小时'][keep]}</small></button><button class="placed setting flip" data-action="flip">翻转<small>180°</small></button><button class="placed setting exit" data-action="exit">退出</button>`;else deck.innerHTML=`<div class="placed confirm-text">退出桌搭？</div><button class="placed confirm-btn" style="left:0px" data-action="cancel"><img src="assets/cancel.png" alt="取消"></button><button class="placed confirm-btn" style="left:398px" data-action="confirm"><img src="assets/confirm.png" alt="确认"></button>`;
drawMotion();q('#label').textContent=view==='eyes'?ROBOT_SCENES[emotion].label:({clock:'薄荷时钟',calendar:'暖金日历',menu:'彩色设置',confirm:'左叉取消 · 右勾确认'})[view];all('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));all('[data-mood]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mood===emotion))}
function setView(next,direction='left'){if(next===view)return;clearTimeout(timer);if(['eyes','clock','calendar'].includes(next))home=next;const epoch=++cardEpoch,started=performance.now();let switched=false;function step(){if(epoch!==cardEpoch)return;const t=performance.now()-started;if(t>=160&&!switched){view=next;render();switched=true}if(t>=420){deck.style.cssText=CARD_REST;return}deck.style.cssText=cardFrame(direction,t);timer=setTimeout(step,FRAME_MS)}step()}

function select(name){emotion=name;moodElapsed=0;render()}
function randomMood(){const names=Object.keys(ROBOT_SCENES).filter(n=>n!==emotion);select(names[Math.floor(Math.random()*names.length)])}
for(const [name,s] of Object.entries(ROBOT_SCENES))q('.moods').insertAdjacentHTML('beforeend',`<button class="mood" data-mood="${name}"><img src="${sprite(s.left)}" alt="">${s.label}</button>`);
all('[data-mood]').forEach(b=>b.onclick=()=>{q('#random').checked=false;if(view!=='eyes')setView('eyes');emotion=b.dataset.mood;moodElapsed=0;render()});all('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view,b.dataset.view==='menu'?'up':'left'));
function swipe(d){if(d==='up')setView('menu','up');else if(d==='down')setView(home,'down');else if(['eyes','clock','calendar'].includes(view)){const modes=['eyes','clock','calendar'];setView(modes[(modes.indexOf(view)+(d==='left'?1:2))%3],d)}}
q('.pill').onkeydown=e=>{const d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d){e.preventDefault();swipe(d)}};let origin=null,moved=false;
q('.pill').onpointerdown=e=>{origin={x:e.clientX,y:e.clientY};moved=false};q('.pill').onpointerup=e=>{if(!origin)return;let dx=e.clientX-origin.x,dy=e.clientY-origin.y;origin=null;if(Math.max(Math.abs(dx),Math.abs(dy))>25){moved=true;if(flipped){dx=-dx;dy=-dy}swipe(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')}};
q('.pill').onclick=e=>{if(moved)return;const action=e.target.closest('[data-action]')?.dataset.action;if(action==='keep'){keep=(keep+1)%3;render()}else if(action==='flip'){flipped=!flipped;q('.screen').style.transform=flipped?'rotate(180deg)':''}else if(action==='exit')setView('confirm','up');else if(action==='cancel')setView('menu','down');else if(action==='confirm'){setView('eyes','down');q('.help').textContent='演示已退出；设备上此步骤会关闭应用。'}else if(view==='eyes')randomMood()};
q('#pause').onchange=()=>q('.screen').classList.toggle('paused',q('#pause').checked);if(matchMedia('(prefers-reduced-motion:reduce)').matches){q('#pause').checked=true;q('#pause').onchange()}
new ResizeObserver(()=>q('.sizer').style.transform=`scale(${Math.min(1.45,(q('.viewport').clientWidth-20)/490)})`).observe(q('.viewport'));setInterval(()=>{if(view==='eyes'&&q('#random').checked&&!q('#pause').checked)randomMood()},8000);render();
</script></body></html>
